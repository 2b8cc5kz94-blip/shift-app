    <style>

            --header-dark: #151d2a;

        }

        * {

        body {

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .month-header {
            display: flex;

        }

<body>

    <header>
        <div class="month-header">
            <button class="nav-btn" id="prevMonthBtn">‹ 前月</button>
            <div class="month-display-wrap">
                <div class="month-title" id="monthText">----年--月 📅</div>

            </div>
            <button class="nav-btn" id="nextMonthBtn">翌月 ›</button>
        </div>

        <div class="backup-bar">
            <button class="backup-btn" onclick="exportData()">💾 バックアップ保存</button>
            <button class="backup-btn" onclick="document.getElementById('importFile').click()">📂 復元</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
        </div>

        <div class="summary-grid">

                <div class="summary-label">月間合計給与</div>

            </div>
            <div class="summary-item">
                <div class="summary-label">合計勤務時間</div>
                <div class="summary-val" id="totalHours">0時間0分</div>
            </div>

                <div class="summary-label">シフト件数</div>
                <div class="summary-val" id="totalCount">0件</div>
            </div>
        </div>
    </header>

    <main>
        <div class="section-bar">
            <span>🕒 シフト一覧</span>
        </div>

        <div id="shiftContainer"></div>

        <div class="guide-box">
            <div class="guide-header" onclick="toggleGuide()">
                <span>ⓘ 時給ルール・算出仕様</span>
                <span id="guideArrow">⌵</span>
            </div>
            <div class="guide-body" id="guideContent">
                ・平日：8:00〜9:00（1,350円） / 9:00〜17:00（1,080円） / 17:00以降（1,350円）<br>
                ・土日祝：全時間帯一律 1,350円<br>
                ・休憩時間控除：45分選択で810円引 / 1時間選択で1,080円引<br>
                ・時間帯を跨ぐシフトは自動分割されて計算されます。
            </div>
        </div>
    </main>

    <div class="bottom-action-bar">
        <button class="btn-action btn-add" id="addBtn">＋ シフトを追加</button>
    </div>

    <!-- 自作カレンダーモーダル -->
    <div class="cal-modal-bg" id="calModal">
        <div class="cal-modal-box">
            <div class="cal-header">
                <button class="cal-nav-btn" onclick="changeCalMonth(-1)">‹</button>
                <div class="cal-title" id="calTitle">2026年11月</div>
                <button class="cal-nav-btn" onclick="changeCalMonth(1)">›</button>
            </div>
            <div class="cal-weekdays">
                <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
            </div>
            <div class="cal-grid" id="calGrid"></div>
            <div class="cal-footer">
                <button class="cal-btn cal-btn-cancel" onclick="closeCalendar(false)">キャンセル</button>
                <button class="cal-btn cal-btn-ok" onclick="closeCalendar(true)">決定</button>
            </div>
        </div>
    </div>

    <script>
        function getVernalEquinoxDay(y) {
            if (y <= 1979) return Math.floor(20.8357 + 0.242194 * (y - 1980) - Math.floor((y - 1983) / 4));
            return Math.floor(20.8431 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
        }

        function getAutumnalEquinoxDay(y) {
            if (y <= 1979) return Math.floor(23.2588 + 0.242194 * (y - 1980) - Math.floor((y - 1983) / 4));
            return Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
        }

        function getNthMonday(y, m, n) {
            let count = 0;
            for (let d = 1; d <= 31; d++) {
                const date = new Date(y, m - 1, d);
                if (date.getMonth() + 1 !== m) break;
                if (date.getDay() === 1) {
                    count++;
                    if (count === n) return d;
                }
            }
            return 0;
        }

        function getHolidaysOfYear(y) {
            const set = new Set();
            const add = (m, d) => set.add(`${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`);

            add(1, 1); add(2, 11); add(2, 23); add(4, 29); add(5, 3); add(5, 4); add(5, 5); add(8, 11); add(11, 3); add(11, 23);
            add(1, getNthMonday(y, 1, 2)); add(7, getNthMonday(y, 7, 3)); add(9, getNthMonday(y, 9, 3)); add(10, getNthMonday(y, 10, 2));
            add(3, getVernalEquinoxDay(y)); add(9, getAutumnalEquinoxDay(y));

            const sorted = Array.from(set).sort();
            const full = new Set(set);
            sorted.forEach(dStr => {
                const [year, month, day] = dStr.split('-').map(Number);
                const dt = new Date(year, month - 1, day);
                if (dt.getDay() === 0) {
                    let sub = new Date(dt);
                    while (true) {
                        sub.setDate(sub.getDate() + 1);
                        const sStr = `${sub.getFullYear()}-${String(sub.getMonth() + 1).padStart(2, '0')}-${String(sub.getDate()).padStart(2, '0')}`;
                        if (!full.has(sStr)) { full.add(sStr); break; }
                    }
                }
            });
            return full;
        }

        function getDayInfo(dateStr) {
            if (!dateStr) return { label: '日付未選択', badge: '', category: 'unknown' };
            const [y, m, d] = dateStr.split('-').map(Number);
            const dt = new Date(y, m - 1, d);
            const dayNames = ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'];
            const dayName = dayNames[dt.getDay()];
            const holidays = getHolidaysOfYear(y);

            if (holidays.has(dateStr) || dt.getDay() === 0 || dt.getDay() === 6) {
                const label = holidays.has(dateStr) ? '祝日' : dayName;
                return { label: label, badge: '土日祝', category: 'weekend' };
            }
            return { label: dayName, badge: '平日', category: 'weekday' };
        }

        // 給与と実労働時間の計算（休憩控除対応）
        function calcSalary(dateStr, startH, startM, endH, endM, breakTime) {
            if (!dateStr || startH === "" || startM === "" || endH === "" || endM === "") {
                return { salary: 0, minutes: 0 };
            }
            const startTotal = Number(startH) * 60 + Number(startM);
            const endTotal = Number(endH) * 60 + Number(endM);
            if (endTotal <= startTotal) return { salary: 0, minutes: 0 };

            const rawMinutes = endTotal - startTotal;
            const info = getDayInfo(dateStr);

            // 休憩時間の定義
            let breakMinutes = 0;
            let breakDeduction = 0;
            if (breakTime === "45") {
                breakMinutes = 45;
                breakDeduction = 810;
            } else if (breakTime === "60") {
                breakMinutes = 60;
                breakDeduction = 1080;
            }

            const netMinutes = Math.max(0, rawMinutes - breakMinutes);
            let rawSalary = 0;

            if (info.category === 'weekend') {
                rawSalary = Math.round((rawMinutes / 60) * 1350);
            } else {
                for (let m = startTotal; m < endTotal; m += 5) {
                    let rate = (m >= 540 && m < 1020) ? 1080 : 1350;
                    rawSalary += (rate / 60) * 5;
                }
                rawSalary = Math.round(rawSalary);
            }

            const finalSalary = Math.max(0, rawSalary - breakDeduction);
            return { salary: finalSalary, minutes: netMinutes };
        }

        let currentYM = "";
        let shifts = [];

        // 自作カレンダー用状態
        let activeShiftIdx = null;
        let tempSelectedDate = "";
        let calYear = 2026;
        let calMonth = 11;

        function getStorageKey() {
            return `shift_app_data_${currentYM}`;
        }

        function saveToStorage() {
            try {
                localStorage.setItem(getStorageKey(), JSON.stringify(shifts));
            } catch(e) {}
        }

        function loadFromStorage() {
            try {
                const saved = localStorage.getItem(getStorageKey());
                return saved ? JSON.parse(saved) : [];
            } catch(e) {
                return [];
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(shifts));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `shift_backup_${currentYM}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (Array.isArray(imported)) {
                            shifts = imported;
                            saveToStorage();
                            renderAll();
                            alert("データを正常に復元しました！");
                        }
                    } catch (err) {
                        alert("ファイルの読み込みに失敗しました。");
                    }
                };
            }
        }

        function initApp() {
            const today = new Date();
            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            currentYM = `${y}-${m}`;

            document.getElementById('prevMonthBtn').onclick = () => changeMonth(-1);
            document.getElementById('nextMonthBtn').onclick = () => changeMonth(1);
            document.getElementById('monthPicker').onchange = (e) => {
                if (e.target.value) {
                    currentYM = e.target.value;
                    loadShifts();
                }
            };
            document.getElementById('addBtn').onclick = addShift;

            window.addEventListener('pagehide', saveToStorage);
            window.addEventListener('blur', saveToStorage);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') saveToStorage();
            });

            loadShifts();
        }

        function loadShifts() {
            const [y, m] = currentYM.split('-');
            document.getElementById('monthText').textContent = `${y}年${parseInt(m, 10)}月 📅`;
            document.getElementById('monthPicker').value = currentYM;

            shifts = loadFromStorage();
            renderAll();
        }

        function addShift() {
            shifts.push({
                date: "",
                startH: "", startM: "",
                endH: "", endM: "",
                breakTime: "0" // デフォルト: なし
            });
            saveToStorage();
            renderAll();
        }

        function deleteShift(idx) {
            shifts.splice(idx, 1);
            saveToStorage();
            renderAll();
        }

        function openCalendar(idx) {
            activeShiftIdx = idx;
            const currentVal = shifts[idx].date;
            tempSelectedDate = currentVal;

            if (currentVal) {
                const [y, m] = currentVal.split('-').map(Number);
                calYear = y;
                calMonth = m;
            } else {
                const [y, m] = currentYM.split('-').map(Number);
                calYear = y;
                calMonth = m;
            }

            renderCalendarGrid();
            document.getElementById('calModal').classList.add('show');
        }

        function changeCalMonth(diff) {
            calMonth += diff;
            if (calMonth > 12) {
                calMonth = 1;
                calYear++;
            } else if (calMonth < 1) {
                calMonth = 12;
                calYear--;
            }
            renderCalendarGrid();
        }

        function renderCalendarGrid() {
            document.getElementById('calTitle').textContent = `${calYear}年${calMonth}月`;
            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';

            const firstDayIndex = new Date(calYear, calMonth - 1, 1).getDay();
            const lastDate = new Date(calYear, calMonth, 0).getDate();
            const holidays = getHolidaysOfYear(calYear);

            for (let i = 0; i < firstDayIndex; i++) {
                const cell = document.createElement('div');
                cell.className = 'cal-day empty';
                grid.appendChild(cell);
            }

            for (let d = 1; d <= lastDate; d++) {
                const mStr = String(calMonth).padStart(2, '0');
                const dStr = String(d).padStart(2, '0');
                const dateStr = `${calYear}-${mStr}-${dStr}`;

                const cell = document.createElement('div');
                cell.className = 'cal-day';
                cell.textContent = d;

                const dt = new Date(calYear, calMonth - 1, d);
                const dayOfWeek = dt.getDay();
                if (dayOfWeek === 0) cell.classList.add('sun');
                if (dayOfWeek === 6) cell.classList.add('sat');
                if (holidays.has(dateStr)) cell.classList.add('holiday');

                if (tempSelectedDate === dateStr) {
                    cell.classList.add('selected');
                }

                cell.onclick = () => {
                    tempSelectedDate = dateStr;
                    renderCalendarGrid();
                };

                grid.appendChild(cell);
            }
        }

        function closeCalendar(isConfirm) {
            if (isConfirm && activeShiftIdx !== null && tempSelectedDate) {
                shifts[activeShiftIdx].date = tempSelectedDate;
                saveToStorage();
                renderAll();
            }
            document.getElementById('calModal').classList.remove('show');
            activeShiftIdx = null;
        }

        function updateBreakTime(idx, breakVal) {
            shifts[idx].breakTime = breakVal;
            saveToStorage();

            const container = document.getElementById('shiftContainer');
            const card = container.children[idx];
            if (card) {
                const btns = card.querySelectorAll('.break-btn');
                btns.forEach(btn => {
                    if (btn.getAttribute('data-val') === breakVal) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }

            updateCardSubtotal(idx);
            updateSummary();
        }

        function updateValue(idx, field, val, element) {
            shifts[idx][field] = val;
            saveToStorage();
            updateCardSubtotal(idx);
            updateSummary();
            updateCardStyle(idx);
        }

        function updateCardStyle(idx) {
            const container = document.getElementById('shiftContainer');
            const card = container.children[idx];
            if (!card) return;
            const shift = shifts[idx];
            if (shift.date) {
                card.className = 'shift-card completed';
            } else {
                card.className = 'shift-card incomplete';
            }
        }

        function updateCardSubtotal(idx) {
            const shift = shifts[idx];
            const res = calcSalary(shift.date, shift.startH, shift.startM, shift.endH, shift.endM, shift.breakTime);
            const container = document.getElementById('shiftContainer');
            const card = container.children[idx];
            if (!card) return;

            const timeSpan = card.querySelector('.sub-val-time');
            const salarySpan = card.querySelector('.sub-val-salary');

            if (timeSpan) timeSpan.textContent = `${Math.floor(res.minutes / 60)}時間${res.minutes % 60}分`;
            if (salarySpan) salarySpan.textContent = `¥${res.salary.toLocaleString()}`;
        }

        function updateSummary() {
            let totalSalary = 0;
            let totalMinutes = 0;
            let validCount = 0;

            shifts.forEach(shift => {
                const res = calcSalary(shift.date, shift.startH, shift.startM, shift.endH, shift.endM, shift.breakTime);
                if (res.minutes > 0 || res.salary > 0) {
                    totalSalary += res.salary;
                    totalMinutes += res.minutes;
                    validCount++;
                }
            });

            document.getElementById('totalSalary').textContent = `¥${totalSalary.toLocaleString()}`;
            document.getElementById('totalHours').textContent = `${Math.floor(totalMinutes / 60)}時間${totalMinutes % 60}分`;
            document.getElementById('totalCount').textContent = `${validCount}件`;
        }

        function renderAll() {
            const container = document.getElementById('shiftContainer');
            container.innerHTML = '';

            if (shifts.length === 0) {
                container.innerHTML = `<div class="empty-text">シフトがありません。<br>「＋ シフトを追加」ボタンを押してください。</div>`;
            } else {
                shifts.forEach((shift, idx) => {
                    const info = getDayInfo(shift.date);
                    const bTime = shift.breakTime || "0";
                    const res = calcSalary(shift.date, shift.startH, shift.startM, shift.endH, shift.endM, bTime);

                    let dateBtnText = "選択してください";
                    let dateBtnClass = "date-dummy-btn empty";
                    if (shift.date) {
                        const [y, m, d] = shift.date.split('-');
                        dateBtnText = `${y}/${m}/${d}`;
                        dateBtnClass = "date-dummy-btn";
                    }

                    const cardClass = shift.date ? 'shift-card completed' : 'shift-card incomplete';

                    const card = document.createElement('div');
                    card.className = cardClass;
                    card.innerHTML = `
                        <div class="card-top">
                            <div>
                                <span class="card-index">#${idx + 1}</span>
                                <span class="badges">
                                    ${info.badge ? `<span class="badge badge-${info.badge}">${info.badge}</span>` : ''}
                                    ${info.label ? `<span class="card-index" style="margin-left:4px;">${info.label}</span>` : ''}
                                </span>
                            </div>
                            <button class="btn-delete" onclick="deleteShift(${idx})">🗑️</button>
                        </div>

                        <div class="field-group">
                            <label class="field-label">勤務日</label>
                            <div class="${dateBtnClass}" onclick="openCalendar(${idx})">${dateBtnText}</div>
                        </div>

                        <div class="field-group">
                            <div style="display:flex; justify-content:space-between;">
                                <label class="field-label">開始時間</label>
                                <label class="field-label" style="margin-right:45%;">終了時間</label>
                            </div>
                            <div class="time-select-grid">
                                <div class="time-box">
                                    <select onchange="updateValue(${idx}, 'startH', this.value, this); this.blur();">${genOptions(23, shift.startH)}</select>
                                    <span>時</span>
                                </div>
                                <div class="time-box">
                                    <select onchange="updateValue(${idx}, 'startM', this.value, this); this.blur();">${genOptions(55, shift.startM, 5)}</select>
                                    <span>分</span>
                                </div>
                                <span class="time-sep">〜</span>
                                <div class="time-box">
                                    <select onchange="updateValue(${idx}, 'endH', this.value, this); this.blur();">${genOptions(23, shift.endH)}</select>
                                    <span>時</span>
                                </div>
                                <div class="time-box">
                                    <select onchange="updateValue(${idx}, 'endM', this.value, this); this.blur();">${genOptions(55, shift.endM, 5)}</select>
                                    <span>分</span>
                                </div>
                            </div>
                        </div>

                        <div class="field-group">
                            <label class="field-label">休憩時間</label>
                            <div class="break-btn-group">
                                <button class="break-btn ${bTime === '0' ? 'active' : ''}" data-val="0" onclick="updateBreakTime(${idx}, '0')">なし</button>
                                <button class="break-btn ${bTime === '45' ? 'active' : ''}" data-val="45" onclick="updateBreakTime(${idx}, '45')">45分</button>
                                <button class="break-btn ${bTime === '60' ? 'active' : ''}" data-val="60" onclick="updateBreakTime(${idx}, '60')">1時間</button>
                            </div>
                        </div>

                        <div class="card-subtotal">
                            <div>
                                <span class="sub-title">小計時間</span><br>
                                <span class="sub-val sub-val-time">${Math.floor(res.minutes / 60)}時間${res.minutes % 60}分</span>
                            </div>
                            <div style="text-align:right;">
                                <span class="sub-title">小計給与</span><br>
                                <span class="sub-val sub-val-salary">¥${res.salary.toLocaleString()}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            updateSummary();
        }

        function genOptions(max, selectedVal, step = 1) {
            let html = `<option value="" ${selectedVal === "" ? 'selected' : ''}>--</option>`;
            for (let i = 0; i <= max; i += step) {
                const valStr = String(i).padStart(2, '0');
                const isSel = String(selectedVal) === valStr ? 'selected' : '';
                html += `<option value="${valStr}" ${isSel}>${i}</option>`;
            }
            return html;
        }

        function changeMonth(diff) {
            const [y, m] = currentYM.split('-').map(Number);
            const dt = new Date(y, m - 1 + diff, 1);
            const newY = dt.getFullYear();
            const newM = String(dt.getMonth() + 1).padStart(2, '0');
            currentYM = `${newY}-${newM}`;
            loadShifts();
        }

        function toggleGuide() {
            const g = document.getElementById('guideContent');
            const a = document.getElementById('guideArrow');
            if (g.classList.contains('show')) {
                g.classList.remove('show');
                a.textContent = '⌵';
            } else {
                g.classList.add('show');
                a.textContent = '⌃';
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
